[project]
name = "metric-notes-grep"
version = "0.1.0"
description = "Local MCP server for literal substring search over the project's Markdown knowledge base"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
